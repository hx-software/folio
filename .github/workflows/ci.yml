name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Native builds link Dioxus Desktop (WebView) and `rfd`.
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev librsvg2-dev \
            libayatana-appindicator3-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked -- -D warnings
      - run: cargo clippy --workspace --target wasm32-unknown-unknown --locked -- -D warnings
      # Must match the `dioxus` version pinned in crates/app/Cargo.toml.
      - run: cargo install dioxus-cli --version 0.7.10 --locked
      - run: dx bundle --web --release
      - uses: actions/upload-artifact@v4
        with:
          name: folio-static-site
          path: target/dx/folio/release/web/public/
