[workspace]
resolver = "2"
members = ["crates/core", "crates/pdf", "crates/app", "crates/worker", "xtask"]
default-members = ["crates/core", "crates/pdf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
numbering-core = { path = "crates/core" }
numbering-pdf = { path = "crates/pdf" }
numbering-worker = { path = "crates/worker" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = "=0.2.130"
web-sys = "0.3.107"
js-sys = "0.3.107"
bincode = "1.3"

[profile.release]
opt-level = "s"
lto = "thin"
